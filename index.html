<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Master AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">IELTS Master AI</h1>
        
        <!-- Navigation Tabs -->
        <div class="flex gap-2 mb-6">
            <button onclick="switchTab('dashboard')" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 transition">Dashboard</button>
            <button onclick="switchTab('vocab')" class="bg-green-600 text-white px-4 py-2 rounded shadow hover:bg-green-700 transition">Vocabulary</button>
            <button onclick="switchTab('analytics')" class="bg-purple-600 text-white px-4 py-2 rounded shadow hover:bg-purple-700 transition">Analytics</button>
        </div>

        <!-- Dashboard Tab -->
        <div id="dashboard" class="space-y-4">
            <h2 class="text-xl font-bold mb-2">Essay Review</h2>
            <textarea id="essayInput" class="w-full border p-3 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" rows="6" placeholder="Paste your IELTS essay here..."></textarea>
            <button onclick="submitEssayReview()" class="bg-indigo-600 text-white px-4 py-2 rounded shadow hover:bg-indigo-700 transition">Review Essay</button>
            <div id="essayOutput" class="hidden p-4 border bg-white rounded shadow-sm"></div>
        </div>

        <!-- Vocabulary Tab -->
        <div id="vocab" class="hidden space-y-4">
            <h2 class="text-xl font-bold mb-4">Vocabulary Trainer</h2>
            <div id="wordBox" class="bg-white p-5 rounded shadow"></div>
            <div class="flex gap-2">
                <button onclick="nextWord()" class="bg-green-600 text-white px-4 py-2 rounded shadow hover:bg-green-700 transition">Next Word</button>
            </div>
        </div>

        <!-- Analytics Tab -->
        <div id="analytics" class="hidden bg-white p-5 rounded shadow">
            <div style="height:400px; position: relative;">
                <canvas id="chart"></canvas>
            </div>
        </div>
    </div>

    <script>
        console.log("APP LOADED");

        const words = [
            { word: 'Mitigate', definition: 'Reduce harm or severity' },
            { word: 'Ubiquitous', definition: 'Found everywhere; omnipresent' },
            { word: 'Pragmatic', definition: 'Practical and realistic approach' }
        ];
        let wordIndex = 0;

        function switchTab(tab) {
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('vocab').classList.add('hidden');
            document.getElementById('analytics').classList.add('hidden');
            
            const target = document.getElementById(tab);
            if (target) target.classList.remove('hidden');

            if (tab === 'analytics') {
                loadChart();
            }
        }

        function submitEssayReview() {
            const essayInput = document.getElementById('essayInput');
            const output = document.getElementById('essayOutput');
            if (!essayInput || !output) return;

            output.classList.remove('hidden');
            output.innerHTML = `
                <b>Overall Band:</b> 7.5<br>
                <b>Vocabulary:</b> 8.0<br>
                <b>Grammar:</b> 7.0
            `;
        }

        function loadWord() {
            const wordBox = document.getElementById('wordBox');
            if (!wordBox || !words.length) return;
            const w = words[wordIndex];
            wordBox.innerHTML = `
                <h3 class="text-2xl font-bold text-indigo-600">${w.word}</h3>
                <p class="mt-2 text-slate-700">${w.definition}</p>
            `;
        }

        function nextWord() {
            wordIndex++;
            if (wordIndex >= words.length) {
                wordIndex = 0;
            }
            loadWord();
        }

        let chartLoaded = false;
        let chartInstance = null;
        function loadChart() {
            const canvas = document.getElementById('chart');
            if (!canvas || typeof Chart === 'undefined') return;

            if (chartLoaded && chartInstance) {
                chartInstance.update();
                return;
            }
            chartLoaded = true;

            chartInstance = new Chart(canvas, {
                type: 'line',
                data: {
                    labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                    datasets: [{
                        label: 'Band Score Progression',
                        data: [6, 6.5, 7, 7.5],
                        borderColor: 'green',
                        backgroundColor: 'rgba(34, 197, 94, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        // Explicit Global Bindings for DevTools / onclick attributes
        window.switchTab = switchTab;
        window.submitEssayReview = submitEssayReview;
        window.nextWord = nextWord;

        window.onload = function() {
            console.log("WINDOW LOADED");
            loadWord();
        };
    </script>
</body>
</html>
