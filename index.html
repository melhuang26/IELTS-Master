<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Vocabulary Matching Game</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    },
                    animation: {
                        'shake': 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both',
                        'bounce-short': 'bounce 0.5s ease-in-out 1'
                    },
                    keyframes: {
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0) rotateY(180deg)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0) rotateY(180deg)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0) rotateY(180deg)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0) rotateY(180deg)' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }

        /* 3D Card Flip CSS */
        .card-perspective {
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner,
        .card.matched .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem;
        }

        .card-back {
            transform: rotateY(0deg);
        }

        .card-front {
            transform: rotateY(180deg);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300 select-none">

    <!-- Navbar / Header -->
    <header class="w-full bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-sm sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-primary-600 text-white p-2.5 rounded-xl shadow-md shadow-primary-500/20">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-primary-600 to-indigo-500 bg-clip-text text-transparent">IELTS Master Match</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">Boost your Band Score through active recall</p>
                </div>
            </div>

            <!-- Utility Controls -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <!-- Sound Toggle -->
                <button id="soundToggleBtn" onclick="toggleSound()" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-all" title="Toggle Sound">
                    <i id="soundIcon" class="fa-solid fa-volume-high text-lg"></i>
                </button>
                <!-- Theme Toggle -->
                <button onclick="toggleTheme()" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-all" title="Toggle Dark/Light Mode">
                    <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
                </button>
                <!-- Restart Button -->
                <button onclick="resetGame()" class="px-4 py-2.5 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-xl shadow-md shadow-primary-500/20 active:scale-95 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span class="hidden sm:inline">Restart</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 flex flex-col items-center">
        
        <!-- Controls Bar -->
        <div class="w-full bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            
            <!-- Category Select -->
            <div class="w-full md:w-auto flex-1 max-w-md">
                <label for="categorySelect" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Vocabulary Set</label>
                <div class="relative">
                    <select id="categorySelect" onchange="resetGame()" class="w-full appearance-none bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 pr-10 text-sm font-semibold text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500 cursor-pointer">
                        <option value="ielts_verbs">Academic Verbs & Adjectives (Band 7.5+)</option>
                        <option value="ielts_environment">Topic: Environment & Ecology</option>
                        <option value="ielts_tech">Topic: Technology & Innovation</option>
                        <option value="ielts_education">Topic: Higher Education & Research</option>
                        <option value="ielts_society">Topic: Society & Culture</option>
                        <option value="ielts_idioms">Band 8+ Advanced Expressions</option>
                    </select>
                    <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>
            </div>

            <!-- Hint Button -->
            <button id="hintBtn" onclick="useHint()" class="w-full md:w-auto px-4 py-2.5 rounded-xl border border-amber-300 dark:border-amber-600 bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 font-semibold text-sm hover:bg-amber-100 dark:hover:bg-amber-900/50 transition-all flex items-center justify-center gap-2">
                <i class="fa-regular fa-lightbulb text-amber-500"></i>
                <span>Hint (<span id="hintCount">2</span> left)</span>
            </button>
        </div>

        <!-- Dashboard Stats -->
        <div class="w-full grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 mb-6">
            <!-- Moves -->
            <div class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-700 text-center shadow-sm">
                <div class="text-xs uppercase tracking-wider font-semibold text-slate-400 mb-1">Moves</div>
                <div class="text-2xl font-bold text-slate-800 dark:text-slate-100" id="moveCount">0</div>
            </div>
            <!-- Timer -->
            <div class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-700 text-center shadow-sm">
                <div class="text-xs uppercase tracking-wider font-semibold text-slate-400 mb-1">Time</div>
                <div class="text-2xl font-bold text-primary-600 dark:text-primary-400" id="timerDisplay">00:00</div>
            </div>
            <!-- Matches -->
            <div class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-700 text-center shadow-sm">
                <div class="text-xs uppercase tracking-wider font-semibold text-slate-400 mb-1">Matches</div>
                <div class="text-2xl font-bold text-emerald-600 dark:text-emerald-400"><span id="matchCount">0</span>/<span id="totalPairs">6</span></div>
            </div>
            <!-- High Score -->
            <div class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-700 text-center shadow-sm">
                <div class="text-xs uppercase tracking-wider font-semibold text-slate-400 mb-1">Best Score</div>
                <div class="text-2xl font-bold text-amber-500" id="bestScoreDisplay">0</div>
            </div>
        </div>

        <!-- Game Grid Container -->
        <div class="w-full min-h-[420px] flex items-center justify-center">
            <div id="gameGrid" class="w-full grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">
                <!-- Cards dynamically injected here -->
            </div>
        </div>
    </main>

    <!-- Victory Modal -->
    <div id="victoryOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden items-center justify-center z-50 p-4 transition-all duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 sm:p-8 max-w-md w-full text-center shadow-2xl border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-300">
            <div class="w-20 h-20 bg-emerald-100 dark:bg-emerald-950/60 rounded-full flex items-center justify-center mx-auto mb-4 text-emerald-600 dark:text-emerald-400 text-4xl animate-bounce-short">
                🏆
            </div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-800 dark:text-white mb-2">Excellent Work!</h2>
            <p class="text-slate-500 dark:text-slate-400 mb-6 text-sm sm:text-base">You have successfully matched all the IELTS vocabulary words for this set.</p>

            <div class="bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-4 mb-6 grid grid-cols-3 gap-2 border border-slate-100 dark:border-slate-700/50">
                <div>
                    <div class="text-xs text-slate-400 font-semibold mb-1">TIME</div>
                    <div id="modalTime" class="text-lg font-bold text-slate-700 dark:text-slate-200">00:00</div>
                </div>
                <div>
                    <div class="text-xs text-slate-400 font-semibold mb-1">MOVES</div>
                    <div id="modalMoves" class="text-lg font-bold text-slate-700 dark:text-slate-200">0</div>
                </div>
                <div>
                    <div class="text-xs text-slate-400 font-semibold mb-1">SCORE</div>
                    <div id="modalScore" class="text-lg font-bold text-primary-600 dark:text-primary-400">0</div>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
                <button onclick="resetGame()" class="flex-1 py-3 px-6 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-xl shadow-lg shadow-primary-500/30 transition-all active:scale-95">
                    Play Again
                </button>
            </div>
        </div>
    </div>

    <!-- Canvas for Confetti -->
    <canvas id="confettiCanvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

    <script>
        // Expanded IELTS Categories Data
        const categories = {
            ielts_verbs: {
                name: "Academic Verbs & Adjectives",
                pairs: [
                    { en: "Substantial", meaning: "Large in size, value, or overall importance" },
                    { en: "Mitigate", meaning: "To make something less severe, harmful, or painful" },
                    { en: "Plausible", meaning: "Seeming reasonable, probable, or likely to be true" },
                    { en: "Exacerbate", meaning: "To make a bad situation or problem worse" },
                    { en: "Advocate", meaning: "To publicly recommend, support, or defend a cause" },
                    { en: "Detrimental", meaning: "Tending to cause harm or subtle damage" }
                ]
            },
            ielts_environment: {
                name: "Environment & Ecology",
                pairs: [
                    { en: "Biodiversity", meaning: "Variety of plant and animal life in a specific habitat" },
                    { en: "Depletion", meaning: "Reduction in the number or quantity of something" },
                    { en: "Sustainable", meaning: "Able to be maintained without exhausting natural resources" },
                    { en: "Ecological", meaning: "Relating to or concerned with the relation of living beings to environment" },
                    { en: "Conservation", meaning: "Prevention of wasteful use or destruction of a resource" },
                    { en: "Contamination", meaning: "The action of making something impure or unsuitable by contact" }
                ]
            },
            ielts_tech: {
                name: "Technology & Innovation",
                pairs: [
                    { en: "Automate", meaning: "To convert a process or facility to operate by automatic control" },
                    { en: "Obsolete", meaning: "No longer produced or used; out of date" },
                    { en: "Breakthrough", meaning: "A sudden, dramatic, and important discovery or development" },
                    { en: "Ubiquitous", meaning: "Present, appearing, or found everywhere simultaneously" },
                    { en: "Cutting-edge", meaning: "At the latest or most advanced stage of development" },
                    { en: "Innovation", meaning: "The introduction of something new or a original method" }
                ]
            },
            ielts_education: {
                name: "Higher Education & Research",
                pairs: [
                    { en: "Curriculum", meaning: "The subjects comprising a course of study in a school" },
                    { en: "Empirical", meaning: "Based on observation or experiment rather than theory" },
                    { en: "Pedagogy", meaning: "The method and practice of teaching as an academic subject" },
                    { en: "Literacy", meaning: "The ability to read, write, and comprehend information" },
                    { en: "Discipline", meaning: "A branch of knowledge or field of study" },
                    { en: "Cognitive", meaning: "Relating to the mental process of acquiring knowledge" }
                ]
            },
            ielts_society: {
                name: "Society & Culture",
                pairs: [
                    { en: "Urbanization", meaning: "The process of making an area more urban and developed" },
                    { en: "Globalization", meaning: "Integration and interaction among worldwide people and nations" },
                    { en: "Demographic", meaning: "Relating to the structure and statistics of populations" },
                    { en: "Assimilation", meaning: "The process of absorbing and integrating into a wider culture" },
                    { en: "Infrastructure", meaning: "Basic physical structures and facilities needed for operation" },
                    { en: "Disparity", meaning: "A great difference, imbalance, or inequality" }
                ]
            },
            ielts_idioms: {
                name: "Band 8+ Advanced Expressions",
                pairs: [
                    { en: "Double-edged sword", meaning: "Something that has both favorable and unfavorable consequences" },
                    { en: "Play a pivotal role", meaning: "To be extremely key, essential, or crucial to a situation" },
                    { en: "Pave the way for", meaning: "To create circumstances enabling future progress" },
                    { en: "A pressing issue", meaning: "An urgent problem requiring immediate action and focus" },
                    { en: "Take for granted", meaning: "Fail to properly appreciate someone or something due to familiarity" },
                    { en: "Bridge the gap", meaning: "To connect two things or reduce difference between them" }
                ]
            }
        };

        // Audio Context Setup (Web Audio API)
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'flip') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(500, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'match') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now); // A4
                osc.frequency.setValueAtTime(554.37, now + 0.1); // C#5
                osc.frequency.setValueAtTime(659.25, now + 0.2); // E5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(180, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'victory') {
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((note, i) => {
                    const noteOsc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    noteOsc.connect(noteGain);
                    noteGain.connect(audioCtx.destination);
                    noteOsc.type = 'triangle';
                    noteOsc.frequency.setValueAtTime(note, now + i * 0.12);
                    noteGain.gain.setValueAtTime(0.25, now + i * 0.12);
                    noteGain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.3);
                    noteOsc.start(now + i * 0.12);
                    noteOsc.stop(now + i * 0.12 + 0.3);
                });
            }
        }

        // Web Speech API Pronunciation
        function speakWord(text, event) {
            if (event) event.stopPropagation(); // prevent flipping card when clicking speaker icon
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop ongoing speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // State Variables
        let flippedCards = [];
        let matchedCount = 0;
        let moves = 0;
        let lockBoard = false;
        let hintsLeft = 2;
        let timerInterval = null;
        let secondsElapsed = 0;
        let gameStarted = false;
        let currentCategoryPairs = [];

        // App Initialization
        window.onload = () => {
            loadThemePreference();
            resetGame();
        };

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            secondsElapsed = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            gameStarted = false;
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const secs = (secondsElapsed % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
        }

        function resetGame() {
            stopTimer();
            document.getElementById('timerDisplay').innerText = '00:00';
            
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            moves = 0;
            hintsLeft = 2;
            lockBoard = false;
            
            document.getElementById('moveCount').innerText = moves;
            document.getElementById('matchCount').innerText = matchedCount;
            document.getElementById('hintCount').innerText = hintsLeft;
            document.getElementById('victoryOverlay').classList.add('hidden');
            document.getElementById('victoryOverlay').classList.remove('flex');

            const selectedCatKey = document.getElementById('categorySelect').value;
            currentCategoryPairs = categories[selectedCatKey].pairs;
            document.getElementById('totalPairs').innerText = currentCategoryPairs.length;

            // Load high score for category
            loadHighScore(selectedCatKey);

            let deck = [];
            currentCategoryPairs.forEach((pair, index) => {
                deck.push({ id: index, text: pair.en, type: 'word' });
                deck.push({ id: index, text: pair.meaning, type: 'meaning' });
            });

            // Shuffle Deck
            deck.sort(() => Math.random() - 0.5);

            deck.forEach((cardData, idx) => {
                const card = document.createElement('div');
                card.className = 'card card-perspective h-32 sm:h-36 cursor-pointer focus:outline-none';
                card.dataset.id = cardData.id;
                card.dataset.type = cardData.type;
                card.tabIndex = 0;
                card.setAttribute('role', 'button');
                card.setAttribute('aria-label', `Flashcard ${idx + 1}`);

                const isWord = cardData.type === 'word';

                card.innerHTML = `
                    <div class="card-inner border-2 border-transparent rounded-xl shadow-md hover:shadow-lg transition-shadow">
                        <!-- Card Back (Default Face) -->
                        <div class="card-back bg-gradient-to-br from-indigo-500 to-primary-600 text-white flex flex-col items-center justify-center rounded-xl p-2">
                            <i class="fa-solid fa-graduation-cap text-2xl opacity-70 mb-1"></i>
                            <span class="text-xs font-medium tracking-wider opacity-90">IELTS</span>
                        </div>
                        <!-- Card Front (Revealed Content Face) -->
                        <div class="card-front bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-xl border-2 ${isWord ? 'border-primary-500' : 'border-indigo-400'} flex flex-col justify-between p-3 relative overflow-hidden">
                            ${isWord ? `
                                <div class="w-full flex justify-end">
                                    <button onclick="speakWord('${escapeJsString(cardData.text)}', event)" class="text-slate-400 hover:text-primary-600 dark:hover:text-primary-400 transition-colors p-1" title="Listen to pronunciation">
                                        <i class="fa-solid fa-volume-high text-sm"></i>
                                    </button>
                                </div>
                                <div class="flex-1 flex items-center justify-center font-bold text-base sm:text-lg text-primary-600 dark:text-primary-400 text-center px-1">
                                    ${cardData.text}
                                </div>
                                <div class="text-[10px] uppercase font-semibold text-slate-400 tracking-wider">Word</div>
                            ` : `
                                <div class="w-full"></div>
                                <div class="flex-1 flex items-center justify-center font-medium text-xs sm:text-sm leading-snug text-slate-600 dark:text-slate-300 text-center overflow-y-auto max-h-full px-1">
                                    ${cardData.text}
                                </div>
                                <div class="text-[10px] uppercase font-semibold text-indigo-400 tracking-wider">Definition</div>
                            `}
                        </div>
                    </div>
                `;

                // Event Listeners for click & keyboard accessibility
                card.addEventListener('click', () => flipCard(card));
                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        flipCard(card);
                    }
                });

                grid.appendChild(card);
            });
        }

        function escapeJsString(str) {
            return str.replace(/'/g, "\\'");
        }

        function flipCard(card) {
            if (lockBoard || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            startTimer();
            playSound('flip');

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moveCount').innerText = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                playSound('match');
                card1.classList.add('matched');
                card2.classList.add('matched');
                
                // Visual match styling update
                const front1 = card1.querySelector('.card-front');
                const front2 = card2.querySelector('.card-front');
                front1.classList.add('border-emerald-500', 'bg-emerald-50/50', 'dark:bg-emerald-950/30');
                front2.classList.add('border-emerald-500', 'bg-emerald-50/50', 'dark:bg-emerald-950/30');

                matchedCount++;
                document.getElementById('matchCount').innerText = matchedCount;
                flippedCards = [];

                if (matchedCount === currentCategoryPairs.length) {
                    onGameVictory();
                }
            } else {
                playSound('wrong');
                lockBoard = true;

                // Add shake animation to wrong cards
                card1.classList.add('animate-shake');
                card2.classList.add('animate-shake');

                setTimeout(() => {
                    card1.classList.remove('animate-shake', 'flipped');
                    card2.classList.remove('animate-shake', 'flipped');
                    flippedCards = [];
                    lockBoard = false;
                }, 1000);
            }
        }

        function useHint() {
            if (hintsLeft <= 0 || lockBoard) return;

            // Find an unmatched card that is not flipped
            const unmatchedCards = Array.from(document.querySelectorAll('.card:not(.matched):not(.flipped)'));
            if (unmatchedCards.length < 2) return;

            const firstCard = unmatchedCards[0];
            const targetId = firstCard.dataset.id;
            const matchingCard = unmatchedCards.find(c => c !== firstCard && c.dataset.id === targetId);

            if (firstCard && matchingCard) {
                hintsLeft--;
                document.getElementById('hintCount').innerText = hintsLeft;

                // Highlight cards temporarily
                firstCard.querySelector('.card-inner').classList.add('ring-4', 'ring-amber-400');
                matchingCard.querySelector('.card-inner').classList.add('ring-4', 'ring-amber-400');

                setTimeout(() => {
                    firstCard.querySelector('.card-inner').classList.remove('ring-4', 'ring-amber-400');
                    matchingCard.querySelector('.card-inner').classList.remove('ring-4', 'ring-amber-400');
                }, 1200);
            }
        }

        function onGameVictory() {
            stopTimer();
            playSound('victory');
            triggerConfetti();

            const finalScore = calculateScore(moves, secondsElapsed);
            const categoryKey = document.getElementById('categorySelect').value;
            saveHighScore(categoryKey, finalScore);

            const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const secs = (secondsElapsed % 60).toString().padStart(2, '0');

            document.getElementById('modalTime').innerText = `${mins}:${secs}`;
            document.getElementById('modalMoves').innerText = moves;
            document.getElementById('modalScore').innerText = finalScore;

            setTimeout(() => {
                const overlay = document.getElementById('victoryOverlay');
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
            }, 500);
        }

        function calculateScore(movesCount, timeSeconds) {
            // Base score algorithm based on speed and accuracy
            const base = 1000;
            const movePenalty = movesCount * 25;
            const timePenalty = timeSeconds * 5;
            return Math.max(100, base - movePenalty - timePenalty);
        }

        // Local Storage High Score
        function loadHighScore(categoryKey) {
            const bestScore = localStorage.getItem(`ielts_best_${categoryKey}`) || 0;
            document.getElementById('bestScoreDisplay').innerText = bestScore;
        }

        function saveHighScore(categoryKey, score) {
            const currentBest = parseInt(localStorage.getItem(`ielts_best_${categoryKey}`) || 0);
            if (score > currentBest) {
                localStorage.setItem(`ielts_best_${categoryKey}`, score);
                document.getElementById('bestScoreDisplay').innerText = score;
            }
        }

        // Sound Toggle
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-lg';
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-lg text-slate-400';
            }
        }

        // Theme Toggle (Light / Dark)
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon(isDark);
        }

        function loadThemePreference() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                updateThemeIcon(true);
            } else {
                document.documentElement.classList.remove('dark');
                updateThemeIcon(false);
            }
        }

        function updateThemeIcon(isDark) {
            const icon = document.getElementById('themeIcon');
            if (isDark) {
                icon.className = 'fa-solid fa-sun text-lg text-amber-400';
            } else {
                icon.className = 'fa-solid fa-moon text-lg';
            }
        }

        // Victory Canvas Confetti Burst
        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }
    </script>
</body>
</html>
