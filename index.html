                const voices = window.speechSynthesis.getVoices();
                const ukVoices = voices.filter(v => v.lang.includes('en-GB') || v.name.includes('UK') || v.name.includes('British') || v.name.includes('United Kingdom'));
                
                britishVoices.female = ukVoices.find(v => v.name.toLowerCase().includes('female') || v.name.includes('Hazel') || v.name.includes('Serena') || v.name.includes('Sonia') || v.name.includes('Google UK English Female')) || ukVoices[0] || voices[0];
                britishVoices.male = ukVoices.find(v => v.name.toLowerCase().includes('male') || v.name.includes('George') || v.name.includes('Daniel') || v.name.includes('Oliver') || v.name.includes('Google UK English Male')) || ukVoices[1] || ukVoices[0] || voices[0];
            };

            updateVoices();
            window.speechSynthesis.onvoiceschanged = updateVoices;
        }

        function speakWord(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.88;

            const selectedGender = document.getElementById('britishVoiceSelect').value;
            const chosenVoice = britishVoices[selectedGender];
            if (chosenVoice) {
                utterance.voice = chosenVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        function onVoiceChanged() {
            playSoundEffect('click');
        }

        // Initialize Matching Grid
        function resetGame() {
            clearLines();
            selectedLeft = null;
            selectedRight = null;
            matchedPairs = [];
            moves = 0;
            streak = 0;
            score = 0;
            secondsElapsed = 0;

            document.getElementById('inlineCardContainer').classList.add('hidden');

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
            }, 1000);

            document.getElementById('matchCount').innerText = '0';
            document.getElementById('streakCount').innerText = '0x';
            document.getElementById('scoreDisplay').innerText = '0';
            document.getElementById('victoryOverlay').classList.add('hidden');

            const categoryKey = document.getElementById('categorySelect').value;
            const rawPairs = database[categoryKey];

            let leftList = rawPairs.map((item, index) => ({
                id: index,
                text: item.en,
                pos: item.pos,
                data: item
            }));

            let rightList = rawPairs.map((item, index) => ({
                id: index,
                text: item.definition,
                data: item
            }));

            leftList.sort(() => Math.random() - 0.5);
            rightList.sort(() => Math.random() - 0.5);

            renderColumns(leftList, rightList);
        }

        function renderColumns(leftList, rightList) {
            const leftCol = document.getElementById('leftColumn');
            const rightCol = document.getElementById('rightColumn');
            leftCol.innerHTML = '';
            rightCol.innerHTML = '';

            leftList.forEach(item => {
                const el = document.createElement('div');
                el.className = "card-left bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 hover:border-indigo-500 dark:hover:border-indigo-400 p-3 rounded-xl cursor-pointer transition-all duration-200 shadow-sm flex items-center justify-between group";
                el.dataset.id = item.id;
                el.onclick = () => {
                    if (matchedPairs.includes(item.id)) {
                        displayInlineStudyCard(item.data);
                    } else {
                        selectLeft(el, item);
                    }
                };

                el.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="px-1.5 py-0.5 rounded text-[9px] font-extrabold uppercase bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400">${item.pos}</span>
                        <span class="font-bold text-xs sm:text-sm text-slate-800 dark:text-slate-100 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition">${item.text}</span>
                    </div>
                    <button onclick="event.stopPropagation(); speakWord('${item.text}')" class="opacity-0 group-hover:opacity-100 p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg text-xs transition" title="Pronounce">
                        🔊
                    </button>
                `;
                leftCol.appendChild(el);
            });

            rightList.forEach(item => {
                const el = document.createElement('div');
                el.className = "card-right bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 hover:border-indigo-500 dark:hover:border-indigo-400 p-3 rounded-xl cursor-pointer transition-all duration-200 shadow-sm flex items-center justify-between group";
                el.dataset.id = item.id;
                el.onclick = () => {
                    if (matchedPairs.includes(item.id)) {
                        displayInlineStudyCard(item.data);
                    } else {
                        selectRight(el, item);
                    }
                };

                el.innerHTML = `
                    <span class="font-medium text-xs text-slate-700 dark:text-slate-300 leading-relaxed">${item.text}</span>
                `;
                rightCol.appendChild(el);
            });
        }

        // Selection & Match Logic
        function selectLeft(el, item) {
            if (matchedPairs.includes(item.id)) return;
            playSoundEffect('click');

            document.querySelectorAll('.card-left').forEach(c => {
                if (!matchedPairs.includes(parseInt(c.dataset.id))) {
                    c.className = "card-left bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 p-3 rounded-xl cursor-pointer transition-all duration-200 shadow-sm flex items-center justify-between group";
                }
            });

            el.className = "card-left bg-indigo-50/50 dark:bg-indigo-950/40 border-2 border-indigo-600 dark:border-indigo-500 p-3 rounded-xl cursor-pointer transition-all duration-200 shadow-md flex items-center justify-between group";
            selectedLeft = { el, item };

            speakWord(item.text);
            checkPairMatch();
        }

        function selectRight(el, item) {
            if (matchedPairs.includes(item.id)) return;
            playSoundEffect('click');

            document.querySelectorAll('.card-right').forEach(c => {
                if (!matchedPairs.includes(parseInt(c.dataset.id))) {
                    c.className = "card-right bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 p-3 rounded-xl cursor-pointer transition-all duration-200 shadow-sm flex items-center justify-between group";
                }
            });

            el.className = "card-right bg-indigo-50/50 dark:bg-indigo-950/40 border-2 border-indigo-600 dark:border-indigo-500 p-3 rounded-xl cursor-pointer transition-all duration-200 shadow-md flex items-center justify-between group";
            selectedRight = { el, item };

            checkPairMatch();
        }

        function checkPairMatch() {
            if (!selectedLeft || !selectedRight) return;

            moves++;
            const isMatch = selectedLeft.item.id === selectedRight.item.id;

            if (isMatch) {
                playSoundEffect('match');
                matchedPairs.push(selectedLeft.item.id);
                streak++;
                score += 100 * streak;

                document.getElementById('matchCount').innerText = matchedPairs.length;
                document.getElementById('streakCount').innerText = `${streak}x`;
                document.getElementById('scoreDisplay').innerText = score;

                // Lock matched styling
                selectedLeft.el.className = "card-left bg-emerald-50 dark:bg-emerald-950/30 border-2 border-emerald-500 p-3 rounded-xl cursor-pointer opacity-90 flex items-center justify-between";
                selectedRight.el.className = "card-right bg-emerald-50 dark:bg-emerald-950/30 border-2 border-emerald-500 p-3 rounded-xl cursor-pointer opacity-90 flex items-center justify-between";

                // Draw connecting SVG line
                drawConnectingLine(selectedLeft.el, selectedRight.el);

                // Show Details Below
                displayInlineStudyCard(selectedLeft.item.data);

                selectedLeft = null;
                selectedRight = null;

                // Victory Check for 10 Pairs
                if (matchedPairs.length === 10) {
                    clearInterval(timerInterval);
                    setTimeout(() => {
                        playSoundEffect('victory');
                        document.getElementById('finalScore').innerText = score;
                        document.getElementById('finalTime').innerText = document.getElementById('timerDisplay').innerText;
                        document.getElementById('victoryOverlay').classList.remove('hidden');
                    }, 800);
                }
            } else {
                playSoundEffect('error');
                streak = 0;
                document.getElementById('streakCount').innerText = '0x';

                selectedLeft.el.classList.add('shake');
                selectedRight.el.classList.add('shake');

                setTimeout(() => {
                    if (selectedLeft) selectedLeft.el.className = "card-left bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 p-3 rounded-xl cursor-pointer transition-all duration-200 shadow-sm flex items-center justify-between group";
                    if (selectedRight) selectedRight.el.className = "card-right bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 p-3 rounded-xl cursor-pointer transition-all duration-200 shadow-sm flex items-center justify-between group";
                    selectedLeft = null;
                    selectedRight = null;
                }, 500);
            }
        }

        // Display Inline Card below Grid
        function displayInlineStudyCard(data) {
            currentModalWordData = data;
            document.getElementById('cardWord').innerText = data.en;
            document.getElementById('cardIpa').innerText = data.ipa;
            document.getElementById('cardPos').innerText = data.pos.toUpperCase();
            document.getElementById('cardMeaning').innerText = data.definition;
            document.getElementById('cardSynonym').innerText = data.synonym;
            document.getElementById('cardAntonym').innerText = data.antonym;
            document.getElementById('cardCollocations').innerText = data.collocations;
            document.getElementById('cardEssayTopic').innerText = data.essayTopic;
            document.getElementById('cardEssayUsage').innerHTML = `"${data.essayUsage}"`;

            const container = document.getElementById('inlineCardContainer');
            container.classList.remove('hidden');
            
            // Smooth auto-scroll to card
            container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // SVG Connector Line Drawing
        function drawConnectingLine(leftEl, rightEl) {
            const svg = document.getElementById('svgOverlay');
            const leftRect = leftEl.getBoundingClientRect();
            const rightRect = rightEl.getBoundingClientRect();

            const x1 = leftRect.right;
            const y1 = leftRect.top + leftRect.height / 2 + window.scrollY;
            const x2 = rightRect.left;
            const y2 = rightRect.top + rightRect.height / 2 + window.scrollY;

            const dx = (x2 - x1) * 0.5;
            const pathData = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', pathData);
            path.setAttribute('stroke', '#10b981');
            path.setAttribute('stroke-width', '3');
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke-linecap', 'round');

            svg.appendChild(path);
        }

        function clearLines() {
            document.getElementById('svgOverlay').innerHTML = '';
        }

        // Hint System
        function getHint() {
            const unmatchedLeft = Array.from(document.querySelectorAll('.card-left')).filter(c => !matchedPairs.includes(parseInt(c.dataset.id)));
            if (unmatchedLeft.length === 0) return;

            playSoundEffect('click');
            const target = unmatchedLeft[0];
            const targetId = target.dataset.id;
            const matchingRight = Array.from(document.querySelectorAll('.card-right')).find(c => c.dataset.id === targetId);

            target.classList.add('ring-4', 'ring-amber-400');
            matchingRight.classList.add('ring-4', 'ring-amber-400');

            setTimeout(() => {
                target.classList.remove('ring-4', 'ring-amber-400');
                matchingRight.classList.remove('ring-4', 'ring-amber-400');
            }, 1200);
        }

        // Theme & Audio Settings
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            document.getElementById('audioToggleBtn').innerText = audioEnabled ? '🔊' : '🔇';
        }

        window.onresize = () => clearLines();

        // Bootstrapping
        window.onload = () => {
            initBritishVoices();
            resetGame();
        };
    </script>
</body>
</html>
